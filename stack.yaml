apiVersion: apps/v1
kind: Deployment
metadata:
  name: xnova-web
  namespace: xnova-k8s-article
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xnova-web
  template:
    metadata:
      labels:
        app: xnova-web
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: xnova-web
  namespace: xnova-k8s-article
spec:
  type: ClusterIP
  selector:
    app: xnova-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xnova-web
  namespace: xnova-k8s-article
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xnova-web
                port:
                  name: http
